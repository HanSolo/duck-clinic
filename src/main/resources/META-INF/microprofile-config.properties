# The language model of the agents is chosen in llm.env (LLM_PROVIDER, LLM_BASE_URL, LLM_MODEL, LLM_API_KEY, LLM_MAX_TOKENS).
# The application supplies its own LargeLanguageModel (agent/ConfiguredLlm), because Payara 7.2026.10 has no OpenAI-format provider.
# While that bean exists, Payara does not create its default model, so payara.agentic.llm.* settings have no effect.
