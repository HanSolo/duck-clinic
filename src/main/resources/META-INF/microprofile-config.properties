# Settings for the Payara runtime of Jakarta Agentic AI (the LargeLanguageModel injected into agent/ReferralAgent).
# Same names and defaults as in DuckInsurance, so that all three agents use the same local Ollama. In the container the values come from llm.env.
# ${NAME:default} is a MicroProfile Config property expression; environment variables and -D properties win over this file.
payara.agentic.llm.provider=${LLM_PROVIDER:ollama}
payara.agentic.llm.model=${LLM_MODEL:qwen3.8:27b}
payara.agentic.llm.ollama.base-url=${LLM_BASE_URL:http://localhost:11434}
