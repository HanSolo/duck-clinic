# Settings for the Payara runtime of Jakarta Agentic AI (the LargeLanguageModel injected into agent/ReferralAgent).
# Same names and defaults as in DuckInsurance, so that all three agents use the same model. In the container the values come from llm.env.
# ${NAME:default} is a MicroProfile Config property expression; environment variables and -D properties win over this file.
#
# Payara 7.2026.10 (fish.payara.ai.agent.llm.LlmBackendFactory) knows the providers ollama, anthropic (alias claude), vertex and none.
# LLM_PROVIDER=ollama    -> Ollama's native API at payara.agentic.llm.ollama.base-url
# LLM_PROVIDER=anthropic -> Anthropic Messages API at payara.agentic.llm.anthropic.base-url with payara.agentic.llm.anthropic.api-key
payara.agentic.llm.provider=${LLM_PROVIDER:ollama}
payara.agentic.llm.model=${LLM_MODEL:qwen3.8:27b}
payara.agentic.llm.ollama.base-url=${LLM_BASE_URL:http://localhost:11434}
payara.agentic.llm.anthropic.base-url=${LLM_BASE_URL:https://api.anthropic.com}
payara.agentic.llm.anthropic.api-key=${LLM_API_KEY:ollama}
