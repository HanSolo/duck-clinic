# Builds the container image of this application and publishes it to GitHub Container Registry (ghcr.io),
# for the combined Duck agents demo (duck-agents-demo). New file only: nothing else in the repository depends on it.
# Runs on every push to the salesdemo branch, or by hand (Actions tab > Publish image > Run workflow).
# The image is ghcr.io/<owner>/duck-clinic:<branch name>, for Intel and Apple Silicon computers.
name: Publish image

on:
  push:
    branches: [salesdemo]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Image name (lower case, as the registry requires)
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/duck-clinic" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:${{ github.ref_name }}
            ${{ steps.name.outputs.image }}:${{ github.ref_name }}-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
